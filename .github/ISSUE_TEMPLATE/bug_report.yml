name: Bug report
description: Report a bug in CLI behavior or icon application
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting this.
        Please include exact commands and output when possible.
  - type: input
    id: command
    attributes:
      label: Command run
      description: Exact command you ran (for example `./scripts/poyd apply n64 --dock`)
      placeholder: ./scripts/poyd ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: macOS version, whether `fileicon` is installed, and app names involved
