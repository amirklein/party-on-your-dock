name: CLI smoke

on:
  push:
    branches: [main]
  pull_request:

jobs:
  smoke:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7

      - name: Make CLI executable
        run: chmod +x scripts/poyd scripts/poyd.swift

      - name: Install fileicon
        run: brew install fileicon

      - name: Help
        run: ./scripts/poyd help

      - name: Version
        run: ./scripts/poyd version

      - name: Themes list (empty ok)
        run: ./scripts/poyd themes

      - name: Init + list a throwaway theme
        run: |
          ./scripts/poyd init-theme "ci smoke theme"
          ./scripts/poyd themes | grep ci-smoke-theme
          test -f themes/ci-smoke-theme/README.md

      - name: List apps
        run: ./scripts/poyd list | head -5

      - name: Dock command runs
        run: ./scripts/poyd dock || true

      - name: Doctor
        run: ./scripts/poyd doctor

      - name: Status (Dock-scoped; empty Dock ok in CI)
        run: ./scripts/poyd status --dock || true

      - name: Missing coverage (expect failures on empty theme)
        run: |
          ./scripts/poyd init-theme "ci-missing-theme"
          ./scripts/poyd missing ci-missing-theme --dock || true

      - name: Validate theme script runs
        run: ./scripts/validate-theme.sh ci-missing-theme || true

      - name: Dry-run apply and revert
        run: |
          ./scripts/poyd apply ci-missing-theme --dry-run || true
          ./scripts/poyd revert --dry-run --dock || true

      - name: Theme coverage script runs
        run: ./scripts/theme-coverage.sh ci-missing-theme --dock || true

      - name: Refresh-dock script is executable
        run: |
          chmod +x scripts/refresh-dock.sh
          ./scripts/refresh-dock.sh || true

      - name: Make preview target runs
        run: make preview THEME=ci-missing-theme || true
